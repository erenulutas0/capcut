# CI and GitHub Pages deploy.
#
# - checks: typecheck, lint, unit tests (Linux, fast).
# - e2e: browser tests + the Pages smoke test on WINDOWS. Chromium on Linux has
#   no AAC encoder for WebCodecs, so every export test would be refused there;
#   the Windows runner matches the verified support matrix (docs/SUPPORT_MATRIX.md).
# - deploy: only after both pass, only for pushes to main. Publishes the static
#   export under https://erenulutas0.github.io/capcut/.
#
# The repository is public, so GitHub-hosted runner minutes are free.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The lock file is written by npm 11; npm 10 (bundled with Node 20)
      # reads it differently and refuses `npm ci`. Same npm as development.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      # Known vulnerabilities in what ships to the browser (or builds it) stop
      # the deploy (docs/security/DEPENDENCIES.md). Dev tools are reported by
      # a plain `npm audit` locally, not gated here.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  e2e:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: web
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The lock file is written by npm 11; npm 10 (bundled with Node 20)
      # reads it differently and refuses `npm ci`. Same npm as development.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - name: Install ffmpeg (test media is generated, never downloaded)
        # The Chocolatey community feed sometimes fails for a few minutes; without
        # ffmpeg 126 tests fail with ENOENT, which looks like a product bug.
        run: |
          for ($i = 1; $i -le 4; $i++) {
            choco install ffmpeg --no-progress -y
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { break }
            if ($env:ChocolateyInstall) { $env:Path += ';' + (Join-Path $env:ChocolateyInstall 'bin') }
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { break }
            Write-Host "ffmpeg not installed (attempt $i), retrying in $($i * 20) s"
            Start-Sleep -Seconds ($i * 20)
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { throw 'ffmpeg could not be installed' }
          ffmpeg -version | Select-Object -First 1
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      # The speech model files of "Yazıya dök" (ADR-036) are not in git. They are fetched from
      # their pinned revisions, sha256-checked (a mismatch fails the build), and kept in the
      # Actions cache under the manifest's hash, so the source is asked once per pin, not per run.
      - name: Restore the speech model files (cache keyed by the pinned manifest)
        uses: actions/cache@v4
        with:
          path: web/.models-cache
          key: clip-models-${{ hashFiles('web/src/domain/modelManifest.json') }}
      - name: Place the small model next to the e2e server (the real-model test runs only with it)
        run: node scripts/fetch-models.mjs --models=base --dest=public/models
      # CLIP_TEST_HOOKS=1: this build (and only this one) lets the UI tests supply a tiny model
      # list and a scripted stand-in recogniser. The published export below is built without it,
      # and refuses to build with it (next.config.ts, scripts/apply-csp.mjs).
      - name: Build (root path, with test hooks) and run the e2e suite
        env:
          GIT_COMMIT: ${{ github.sha }}
          CLIP_TEST_HOOKS: '1'
        run: |
          npm run build
          npx playwright test
      # `npm run build` also writes the Content-Security-Policy <meta> into
      # every page and drops source maps (scripts/apply-csp.mjs); the smoke
      # test below fails if either is missing.
      - name: Build the GitHub Pages export
        env:
          GIT_COMMIT: ${{ github.sha }}
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: /capcut
          NEXT_PUBLIC_SUPPORT_CONTACT: https://github.com/erenulutas0/capcut/issues
          NEXT_PUBLIC_HOSTING_PROVIDER: GitHub Pages (GitHub, Inc.)
          NEXT_PUBLIC_HOSTING_LOG_POLICY: https://docs.github.com/site-policy/privacy-policies/github-general-privacy-statement
        run: |
          if (Test-Path out) { Remove-Item -Recurse -Force out }
          npm run build
      # Both models go into the published site: base (every device) and large-v3-turbo (WebGPU).
      # ~675 MB of model files + the site; GitHub Pages allows 1 GB per published site.
      # To publish the small model only, change the list to "base" — nothing else.
      - name: Add the model files to the export (plain copies, sha256-checked)
        run: |
          node scripts/fetch-models.mjs --models=base,turbo --dest=out/models --copy
          node scripts/fetch-models.mjs --models=base,turbo --dest=out/models --check
      - name: Smoke test the export under /capcut/
        run: npx playwright test -c playwright.pages.config.ts
      - name: Keep the tested export for the deploy job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/out
          retention-days: 1
      - name: Keep Playwright output when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7

  deploy:
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Deploys exactly the files the smoke test passed on; nothing is rebuilt.
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
