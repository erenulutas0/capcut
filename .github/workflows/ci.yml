# CI and GitHub Pages deploy.
#
# - checks: typecheck, lint, unit tests (Linux, fast).
# - e2e: browser tests + the Pages smoke test on WINDOWS. Chromium on Linux has
#   no AAC encoder for WebCodecs, so every export test would be refused there;
#   the Windows runner matches the verified support matrix (docs/SUPPORT_MATRIX.md).
# - deploy: only after both pass, only for pushes to main. Publishes the static
#   export under https://erenulutas0.github.io/capcut/.
#
# The repository is public, so GitHub-hosted runner minutes are free.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  e2e:
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: web
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install ffmpeg (test media is generated, never downloaded)
        run: choco install ffmpeg --no-progress -y
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Build (root path) and run the e2e suite
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: |
          npm run build
          npx playwright test
      - name: Build the GitHub Pages export
        env:
          GIT_COMMIT: ${{ github.sha }}
          STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: /capcut
          NEXT_PUBLIC_SUPPORT_CONTACT: https://github.com/erenulutas0/capcut/issues
          NEXT_PUBLIC_HOSTING_PROVIDER: GitHub Pages (GitHub, Inc.)
          NEXT_PUBLIC_HOSTING_LOG_POLICY: https://docs.github.com/site-policy/privacy-policies/github-general-privacy-statement
        run: |
          if (Test-Path out) { Remove-Item -Recurse -Force out }
          npm run build
      - name: Smoke test the export under /capcut/
        run: npx playwright test -c playwright.pages.config.ts
      - name: Keep the tested export for the deploy job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/out
          retention-days: 1
      - name: Keep Playwright output when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results
          retention-days: 7

  deploy:
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Deploys exactly the files the smoke test passed on; nothing is rebuilt.
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
