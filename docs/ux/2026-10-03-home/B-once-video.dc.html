<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Açılış: önce video</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#d2ef78}a:hover{color:#e4f7a6}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 16px; background: #101315; color: #f3f5ee; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 32px; height: 32px; border-radius: 9px; background: #d2ef78; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#17200c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a3 3 0 1 0 6 0a3 3 0 1 0-6 0M3 18a3 3 0 1 0 6 0a3 3 0 1 0-6 0M20 4L8.12 15.88M14.47 14.48L20 20M8.12 8.12L12 12"></path></svg>
      </div>
      <div style="font-size: 20px; font-weight: 700; letter-spacing: -0.3px">clip</div>
    </div>
    <a href="#" style="font-size: 14px; padding: 12px 4px">Kendim düzenleyeceğim</a>
  </div>

  <sc-if value="{{notPicked}}" hint-placeholder-val="{{true}}">
    <div style="display: flex; flex-direction: column; gap: 20px; flex-grow: 1; justify-content: center">
      <div style="display: flex; flex-direction: column; gap: 8px; text-align: center">
        <h1 style="margin: 0; font-size: 32px; line-height: 1.15; font-weight: 750; letter-spacing: -0.5px">Videonu seç</h1>
        <div style="font-size: 16px; color: #abb4ae">Sonra ne yapmak istediğini soracağız.</div>
      </div>
      <button type="button" onClick="{{pick}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; height: 260px; background: #181c1f; border: 2px dashed #5d6b63; border-radius: 20px; color: #f3f5ee; font: inherit; cursor: pointer">
        <div style="width: 72px; height: 72px; border-radius: 22px; background: #d2ef78; display: flex; align-items: center; justify-content: center">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#17200c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 21h14"></path></svg>
        </div>
        <div style="font-size: 20px; font-weight: 700">Video seç</div>
        <div style="font-size: 14px; color: #abb4ae">Galeriden ya da dosyalardan</div>
      </button>
      <div style="font-size: 13px; color: #abb4ae; text-align: center">Videon cihazından çıkmaz. Hesap gerekmez.</div>
    </div>
  </sc-if>

  <sc-if value="{{picked}}" hint-placeholder-val="{{false}}">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px; background: #181c1f; border: 1px solid #343d3b; border-radius: 14px">
        <div style="width: 64px; height: 44px; border-radius: 8px; background: #2a3230; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #abb4ae">[video karesi]</div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
          <div style="font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">tatil-videosu.mp4</div>
          <div style="font-size: 13px; color: #abb4ae">2 dk 14 sn</div>
        </div>
        <button type="button" onClick="{{unpick}}" style="min-height: 44px; padding: 0 12px; background: transparent; border: 1px solid #5d6b63; border-radius: 10px; color: #f3f5ee; font: inherit; font-size: 14px; cursor: pointer">Değiştir</button>
      </div>
      <h1 style="margin: 0; font-size: 26px; line-height: 1.2; font-weight: 750; letter-spacing: -0.4px">Bu videoyla ne yapalım?</h1>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{tasks}}" as="task" hint-placeholder-count="8">
          <button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 12px; background: #181c1f; border: 1px solid #343d3b; border-radius: 14px; color: #f3f5ee; font: inherit; text-align: left; cursor: pointer">
            <div style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; background: rgba(210, 239, 120, 0.12); display: flex; align-items: center; justify-content: center">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d2ef78" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{task.d}}"></path></svg>
            </div>
            <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0">
              <div style="font-size: 17px; font-weight: 700">{{task.label}}</div>
              <div style="font-size: 13px; color: #abb4ae">{{task.sub}}</div>
            </div>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#abb4ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var picked = Boolean(this.state && this.state.picked);
var self = this;
return {
picked: picked,
notPicked: !picked,
pick: function () { self.setState({ picked: true }); },
unpick: function () { self.setState({ picked: false }); },
tasks: [
{ label: 'Kes', sub: 'İstediğin yerleri al', d: 'M3 6a3 3 0 1 0 6 0a3 3 0 1 0-6 0M3 18a3 3 0 1 0 6 0a3 3 0 1 0-6 0M20 4L8.12 15.88M14.47 14.48L20 20M8.12 8.12L12 12' },
{ label: 'Boşlukları at', sub: 'Sessiz yerleri çıkar', d: 'M4 10v4M8 6v12M12 11v2M16 6v12M20 10v4' },
{ label: 'Dikey yap', sub: 'Reels, TikTok, Shorts', d: 'M7 4a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2zM11 18h2' },
{ label: 'Küçült', sub: 'WhatsApp’a sığdır', d: 'M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7' },
{ label: 'Yazıya dök', sub: 'Altyazı ve metin', d: 'M5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2zM7 15h4M15 15h2M7 11h2M13 11h4' },
{ label: 'Müzik ekle', sub: 'Kendi müziğini koy', d: 'M9 18V5l12-2v13M3 18a3 3 0 1 0 6 0a3 3 0 1 0-6 0M15 16a3 3 0 1 0 6 0a3 3 0 1 0-6 0' },
{ label: 'Sesini al', sub: 'Videodan ses dosyası', d: 'M11 5L6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7' },
{ label: 'Her yerde açılsın', sub: 'Standart MP4’e çevir', d: 'M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5' }
]
};
}
}
</script>
</body>
</html>
